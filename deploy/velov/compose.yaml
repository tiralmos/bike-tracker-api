# Self-hosted Bike Tracker API for Lyon Vélo'v bike-share stations.
#
# The Vélo'v GBFS feed is open data: no account or credentials needed.
#
# Expects the configurator repository cloned next to this one:
#
#   <some folder>/
#   ├── bike-tracker-api/            (this repository; run compose from deploy/velov)
#   └── bike-tracker-configurator/   (https://github.com/tiralmos/bike-tracker-configurator)
#
# Set your computer's network address (and optionally the API port) in
# deploy/velov/.env (copy .env.example). See docs/deployment/deploy-velov.md for the full guide.

name: bike-tracker-velov

services:
  api:
    build:
      context: ../..
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      REDIS_URL: "redis://redis:6379"
      TZ: "Europe/Paris"
      FEEDS_CONFIG: |
        feeds:
          velov:
            name: Vélo'v
            description: Lyon, France
            # Box around the Lyon metropolis, so the configurator map
            # opens on Lyon (the feed also lists a few test stations
            # far away from it).
            serviceArea:
              - [[4.75, 45.67], [5.0, 45.67], [5.0, 45.91], [4.75, 45.91], [4.75, 45.67]]
            gbfs:
              url: https://download.data.grandlyon.com/files/rdata/jcd_jcdecaux.jcdvelov/gbfs.json
    ports:
      # Published on every network interface so the display on your Wi-Fi can reach it.
      # The port on your computer is API_PORT from .env (3001 if unset); inside
      # the container the API always listens on 3000.
      - "${API_PORT:-3001}:3000"

  configurator:
    build:
      context: ../../../bike-tracker-configurator
      args:
        API_HOST: "http://${HOST_IP:?Set HOST_IP in deploy/velov/.env}:${API_PORT:-3001}"
    restart: unless-stopped
    ports:
      # Open http://localhost:8080 in Chrome or Edge on this computer. It must be
      # "localhost": the browser only allows USB (Web Serial) access from there.
      - "127.0.0.1:8080:80"

  redis:
    image: redis:6
    restart: unless-stopped
